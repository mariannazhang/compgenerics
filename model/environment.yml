# Python environment for the model/ directory.
#
# Setup:
#   conda env create -f environment.yml
#   python -m ipykernel install --user --name compgenerics --display-name "Python (compgenerics)"
name: compgenerics
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pandas
  - pip:
      - jax==0.10.2
      - pyvbmc==1.0.4
      - numpy
      - scipy
      - matplotlib
      - jupyter
      - ipykernel
